name: Cross-platform builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            command: flutter build windows --release
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
          - target: macos
            os: macos-latest
            command: flutter build macos --release
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Generate missing native platform scaffolding
        shell: bash
        run: bash tool/bootstrap-platforms.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build target
        shell: bash
        run: ${{ matrix.command }}
